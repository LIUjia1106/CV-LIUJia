# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  # `ember` is a custom warm palette defined in `assets/css/themes/ember.css`
  # (heat flows from hot to cold - so does this site's colour scheme).
  # Any built-in palette also works: blue, cyan, emerald, green, indigo, purple, red, rose, sky, teal, zinc.
  color: ember

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Jia Liu (刘佳) - Ph.D. student at HKUST developing fast, reliable numerical methods for multiscale heat transfer: phonon and electron–phonon Boltzmann transport, synthetic iterative schemes, and reduced-order modelling.'
    twitter: 'jia_liu00'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: "Jia Liu · 刘佳"

# Site footer
footer:
  copyright:
    notice: '© {year} Jia Liu. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
